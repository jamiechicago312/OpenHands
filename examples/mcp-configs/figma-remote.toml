# Figma MCP Remote Server Configuration
# Copy this file to ~/.openhands/config.toml to use Figma MCP with remote server
#
# Prerequisites:
# 1. Figma account with Dev or Full seat
# 2. Professional, Organization, or Enterprise plan
# 3. OAuth authentication will be handled automatically

[mcp]
shttp_servers = [
    { url = "https://mcp.figma.com/mcp" }
]

# Optional: Add other MCP servers
# shttp_servers = [
#     { url = "https://mcp.figma.com/mcp" },
#     { url = "https://your-other-mcp-server.com/mcp" }
# ]
