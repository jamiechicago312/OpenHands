# Figma MCP Local Server Configuration
# Copy this file to ~/.openhands/config.toml to use Figma MCP with local server
#
# Prerequisites:
# 1. Install Figma desktop app: https://www.figma.com/downloads/
# 2. Enable MCP server: Figma menu → Preferences → Enable local MCP server
# 3. Ensure Figma desktop app is running

[mcp]
shttp_servers = [
    { url = "http://127.0.0.1:3845/mcp" }
]

# Optional: Add other MCP servers
# shttp_servers = [
#     { url = "http://127.0.0.1:3845/mcp" },
#     { url = "https://your-other-mcp-server.com/mcp" }
# ]
